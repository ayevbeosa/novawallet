include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    prefer_single_quotes: true
    always_use_package_imports: true
    # very_good_analysis' full strictness is a mismatch for a 48h take-home:
    # requiring a dartdoc comment on every public getter/class produces
    # boilerplate, not clarity, and directly conflicts with "comment only
    # the non-obvious why" — so it's off, and the 80-char wrap is relaxed
    # in favour of readable named-parameter call sites. See README.
    public_member_api_docs: false
    lines_longer_than_80_chars: false

analyzer:
  exclude: [ build/**, lib/**.g.dart, lib/**.mapper.dart, lib/**.gen.dart ]
  errors:
    invalid_annotation_target: ignore
    inference_failure_on_function_invocation: ignore
    inference_failure_on_generic_invocation: ignore
    inference_failure_on_untyped_parameter: ignore
